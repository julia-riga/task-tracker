services:
  # База данных MySQL
  mysql:
    image: mysql:8.0
    container_name: task-tracker-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: task_tracker
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - task-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend (Node.js + Express)
  backend:
    build: ./backend
    container_name: task-tracker-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: task_tracker
      DB_PORT: 3306
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - task-network

  # Frontend (nginx)
  frontend:
    build: ./frontend
    container_name: task-tracker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - task-network

volumes:
  mysql_data:

networks:
  task-network:
    driver: bridge